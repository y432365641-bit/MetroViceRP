name: Build MetroViceRP
on:
  push:
    branches:
      - feature/embedded-resource-pack-delivery
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetroViceRP-fixed-bedrock-pack
          path: target/MetroViceRP.jar
          if-no-files-found: error
