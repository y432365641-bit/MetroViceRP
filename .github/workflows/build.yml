name: Build MetroViceRP Complete Bundle
on:
  push:
    branches: [ main, feature/core-systems, feature/police-duty-ranks-resourcepack ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Assemble Java and Bedrock packs
        run: |
          mkdir -p bundle/plugins bundle/resourcepacks
          cp target/MetroViceRP.jar bundle/plugins/
          (cd resourcepacks/java && zip -qr ../../bundle/resourcepacks/MetroViceRP-Java.zip .)
          (cd resourcepacks/bedrock && zip -qr ../../bundle/resourcepacks/MetroViceRP-Bedrock.mcpack .)
          sha1sum bundle/resourcepacks/MetroViceRP-Java.zip bundle/resourcepacks/MetroViceRP-Bedrock.mcpack > bundle/resourcepacks/RESOURCEPACK-SHA1.txt
          cat > bundle/README-AR.txt <<'EOF'
Metro Vice RP - الحزمة المجمعة

المحتويات:
- plugins/MetroViceRP.jar : البلجن، يوضع داخل مجلد plugins ثم أعد تشغيل السيرفر.
- resourcepacks/MetroViceRP-Java.zip : حزمة Java.
- resourcepacks/MetroViceRP-Bedrock.mcpack : حزمة Bedrock.
- resourcepacks/RESOURCEPACK-SHA1.txt : بصمات SHA-1.

مهم:
ملف ZIP هذا حزمة توزيع واحدة وليس ملفًا يرفعه Enzonic مباشرةً كبلجن.
استخرج الملفات: ارفع ملف JAR إلى plugins، وارفع/استضف حزم الموارد على رابط HTTPS مباشر واضبط resource-pack.url و resource-pack.sha1 في config.yml.
حزمة Java وحزمة Bedrock منفصلتان لأن طريقة التوزيع مختلفة.
لا تحذف مجلد plugins/MetroViceRP أو ملف قاعدة البيانات عند التحديث.
EOF
          cd bundle && zip -qr ../MetroViceRP-Complete-Bundle.zip .
      - name: Upload combined plugin and resource packs
        uses: actions/upload-artifact@v4
        with:
          name: MetroViceRP-Complete-Bundle
          path: MetroViceRP-Complete-Bundle.zip
          if-no-files-found: error
      - name: Upload standalone plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetroViceRP-Plugin
          path: target/MetroViceRP.jar
          if-no-files-found: error