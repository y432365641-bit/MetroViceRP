name: MetroViceRP Build and Bundle
on:
  push:
    branches:
      - feature/police-duty-ranks-resourcepack
      - feature/bedrock-geyser-api-pack-manager
      - feature/core-systems
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin with embedded Bedrock content
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetroViceRP-Plugin-0.9.2
          path: target/MetroViceRP.jar
          if-no-files-found: error
          retention-days: 90
