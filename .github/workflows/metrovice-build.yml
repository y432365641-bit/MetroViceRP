name: MetroViceRP Build and Bundle
on:
  push:
    branches:
      - feature/police-duty-ranks-resourcepack
      - feature/core-systems
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Assemble installable bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s target/MetroViceRP.jar
          mkdir -p bundle/plugins/Geyser-Spigot/packs bundle/resourcepacks
          cp target/MetroViceRP.jar bundle/plugins/MetroViceRP.jar
          (cd resourcepacks/java && zip -qr ../../bundle/resourcepacks/MetroViceRP-Java.zip .)
          (cd resourcepacks/bedrock && zip -qr ../../bundle/resourcepacks/MetroViceRP-Bedrock.mcpack .)
          cp bundle/resourcepacks/MetroViceRP-Bedrock.mcpack bundle/plugins/Geyser-Spigot/packs/
          sha1sum bundle/resourcepacks/MetroViceRP-Java.zip bundle/resourcepacks/MetroViceRP-Bedrock.mcpack > bundle/resourcepacks/RESOURCEPACK-SHA1.txt
          cat > bundle/INSTALL-AR.txt <<'EOF'
          Metro Vice RP - حزمة التثبيت
          
          1) ارفع plugins/MetroViceRP.jar إلى مجلد plugins في السيرفر.
          2) ارفع plugins/Geyser-Spigot/packs/MetroViceRP-Bedrock.mcpack إلى المسار نفسه داخل مجلد Geyser-Spigot في السيرفر. أعد التشغيل حتى يرسل Geyser الحزمة لعملاء Bedrock.
          3) حزمة Java منفصلة داخل resourcepacks/MetroViceRP-Java.zip. استضفها على رابط HTTPS مباشر واضبط resource-pack.enabled/url/sha1 في config.yml باستخدام قيمة SHA-1 المطابقة في RESOURCEPACK-SHA1.txt.
          4) لا ترفع ملف ZIP الكامل كأنه بلجن. استخرج الحزمة أولًا.
          5) لا تحذف plugins/MetroViceRP/metrovice.db عند التحديث؛ هذا ملف بيانات الشخصيات والأقسام.
          
          ملاحظة: الحزمة تجمع ملفات التوزيع فقط. يجب اختبار عرض الموارد والواجهات داخل عميل Java وBedrock بعد التثبيت.
          EOF
          (cd bundle && zip -qr ../MetroViceRP-Complete-Bundle.zip .)
      - name: Upload complete bundle
        uses: actions/upload-artifact@v4
        with:
          name: MetroViceRP-Complete-Bundle
          path: MetroViceRP-Complete-Bundle.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetroViceRP-Plugin
          path: target/MetroViceRP.jar
          if-no-files-found: error
          retention-days: 90
