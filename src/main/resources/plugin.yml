name: MetroViceRP
version: 0.4.0
main: com.metrovice.rp.MetroViceRP
api-version: '1.21'
authors: [Metro Vice RP]
description: Character-based roleplay framework for Metro Vice RP.
commands:
  mvrp:
    description: MetroViceRP core status and administration
    usage: /mvrp [info|reload|setjob|setrank]
  duty:
    description: Toggle police or EMS duty status
    usage: /duty [police|ems]
  bank:
    description: Character-linked banking
    usage: /bank <balance|deposit|withdraw|send>
  character:
    aliases: [char]
    description: Create and manage isolated roleplay characters
    usage: /character <create|list|select|info|rename|delete>
permissions:
  metrovice.admin:
    description: Manage MetroViceRP
    default: op
