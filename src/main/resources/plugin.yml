name: MetroViceRP
version: 0.9.5
main: com.metrovice.rp.MetroViceRP
api-version: '1.21'
depend: [Geyser-Spigot]
authors: [Metro Vice RP]
description: Metro Vice RP roleplay systems with bundled Java and Bedrock resource packs.
commands:
  mvrp:
    description: MetroViceRP core status and administration
    usage: /mvrp [info|reload|setjob|setrank|hirepolice|hireems|firepolice|fireems|dutylist|givelaptop|givephone|giveradio|banknpc]
  emsbaggive:
    description: Give an EMS medical bag to a player
    usage: /emsbaggive <player>
  ranklaptopgive:
    description: Give a separate police rank management laptop
    usage: /ranklaptopgive <player>
  mdt:
    description: Police mobile data terminal
    usage: /mdt [roster|search <name>]
  radio:
    aliases: [r]
    description: Send a message over the selected Metro Vice radio channel
    usage: /radio <message>
  duty:
    description: Toggle police or EMS duty status
    usage: /duty [police|ems]
  bank:
    description: Character-linked banking
    usage: /bank <balance|deposit|withdraw|send>
  inventory:
    aliases: [bag]
    description: Open the character custom bag
    usage: /inventory
  outfit:
    description: Save and equip character-specific clothing sets
    usage: /outfit [list|save <name>|load <name>]
  character:
    aliases: [char]
    description: Create and manage isolated roleplay characters
    usage: /character [menu|create|list|switch|info|rename|delete]
permissions:
  metrovice.admin:
    description: Manage MetroViceRP
    default: op
